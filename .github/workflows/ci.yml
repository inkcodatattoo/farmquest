name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: farmquest_ci
          POSTGRES_PASSWORD: farmquest_ci
          POSTGRES_DB: farmquest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U farmquest_ci -d farmquest_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://farmquest_ci:farmquest_ci@127.0.0.1:5432/farmquest_ci?schema=farmquest
      DATABASE_MIGRATION_URL: postgresql://farmquest_ci:farmquest_ci@127.0.0.1:5432/farmquest_ci?schema=farmquest
      CI_DATABASE_ADMIN_URL: postgresql://farmquest_ci:farmquest_ci@127.0.0.1:5432/farmquest_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.7.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --allow-build=@prisma/engines --allow-build=prisma --allow-build=esbuild

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: farmquest_ci
        run: pg_isready -h 127.0.0.1 -p 5432 -U farmquest_ci -d farmquest_ci

      - name: Verify repository structure
        run: node scripts/check-structure.mjs

      - name: Validate Prisma 7 schema
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Generate OpenAPI 0.1
        run: pnpm openapi:generate

      - name: Verify generated OpenAPI has no drift
        run: git diff --exit-code -- docs/openapi/farmquest-0.1.json

      - name: Provision database roles
        run: psql "$CI_DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/postgres/bootstrap/roles.sql

      - name: Apply committed migrations
        run: pnpm --filter @farmquest/database exec prisma migrate deploy --config prisma7.config.ts

      - name: Apply least-privilege grants
        run: psql "$CI_DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/postgres/bootstrap/grants.sql

      - name: Verify database invariants and privileges
        run: |
          psql "$CI_DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('farmquest.farm') IS NULL THEN
              RAISE EXCEPTION 'farmquest.farm was not created';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_indexes
              WHERE schemaname = 'farmquest'
                AND indexname = 'farm_user_streamer_active_uq'
            ) THEN
              RAISE EXCEPTION 'active farm partial unique index missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_indexes
              WHERE schemaname = 'farmquest'
                AND indexname = 'planted_crop_active_uq'
            ) THEN
              RAISE EXCEPTION 'active planting partial unique index missing';
            END IF;

            IF has_table_privilege('farmquest_app', 'farmquest.coin_ledger', 'UPDATE') THEN
              RAISE EXCEPTION 'farmquest_app must not UPDATE coin_ledger';
            END IF;

            IF NOT has_table_privilege('farmquest_app', 'farmquest.coin_ledger', 'INSERT') THEN
              RAISE EXCEPTION 'farmquest_app must be able to INSERT coin_ledger';
            END IF;

            IF has_schema_privilege('farmquest_app', 'farmquest', 'CREATE') THEN
              RAISE EXCEPTION 'farmquest_app must not CREATE in schema';
            END IF;

            IF to_regclass('farmquest.user_session') IS NULL THEN
              RAISE EXCEPTION 'farmquest.user_session was not created';
            END IF;

            IF NOT has_table_privilege('farmquest_app', 'farmquest.user_session', 'INSERT,UPDATE,DELETE') THEN
              RAISE EXCEPTION 'farmquest_app needs session lifecycle privileges';
            END IF;
          END
          $$;
          SQL

      - name: Configure CI runtime role
        run: |
          psql "$CI_DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE farmquest_app PASSWORD 'farmquest_app_ci';"

      - name: Smoke test API with runtime role
        env:
          DATABASE_URL: postgresql://farmquest_app:farmquest_app_ci@127.0.0.1:5432/farmquest_ci
          APP_STAGE: dev
          DEV_LOGIN_ENABLED: "true"
          DEV_LOGIN_SECRET: ci-dev-login-secret
          CSRF_SECRET: ci-csrf-secret
          SESSION_COOKIE_SECURE: "false"
          PORT: "3001"
        run: |
          set -euo pipefail
          PGPASSWORD=farmquest_app_ci psql -h 127.0.0.1 -U farmquest_app -d farmquest_ci -v ON_ERROR_STOP=1 -c "SELECT 1"
          pnpm --filter @farmquest/api start > /tmp/farmquest-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true; cat /tmp/farmquest-api.log' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health/ready > /tmp/ready.json; then
              break
            fi
            sleep 1
          done

          grep -q '"status":"ready"' /tmp/ready.json

          curl --fail --silent --show-error \
            -c /tmp/farmquest-cookies.txt \
            -X POST \
            -H "X-Dev-Login-Secret: ci-dev-login-secret" \
            http://127.0.0.1:3001/api/v1/dev/session \
            -o /dev/null

          curl --fail --silent --show-error \
            -b /tmp/farmquest-cookies.txt \
            http://127.0.0.1:3001/api/v1/auth/me \
            | grep -q '"displayName":"Coda"'

          curl --fail --silent --show-error \
            -b /tmp/farmquest-cookies.txt \
            http://127.0.0.1:3001/api/v1/farms \
            | grep -q '"coins":"100"'

          curl --fail --silent --show-error \
            -b /tmp/farmquest-cookies.txt \
            http://127.0.0.1:3001/api/v1/farms/00000000-0000-4000-8000-000000000004/plots \
            | grep -q '"state":"EMPTY"'

          CSRF=$(curl --fail --silent --show-error \
            -b /tmp/farmquest-cookies.txt \
            http://127.0.0.1:3001/api/v1/auth/csrf \
            | node -e 'let d=""; process.stdin.on("data",c=>d+=c); process.stdin.on("end",()=>process.stdout.write(JSON.parse(d).csrfToken));')

          PLANT_KEY="ci-plant-idempotency-0001"
          curl --fail --silent --show-error \
            -b /tmp/farmquest-cookies.txt \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-CSRF-Token: $CSRF" \
            -H "Idempotency-Key: $PLANT_KEY" \
            --data '{"cropDefinitionId":"00000000-0000-4000-8000-000000000022"}' \
            http://127.0.0.1:3001/api/v1/farms/00000000-0000-4000-8000-000000000004/plant \
            > /tmp/plant-1.json &
          PLANT_PID_1=$!

          curl --fail --silent --show-error \
            -b /tmp/farmquest-cookies.txt \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-CSRF-Token: $CSRF" \
            -H "Idempotency-Key: $PLANT_KEY" \
            --data '{"cropDefinitionId":"00000000-0000-4000-8000-000000000022"}' \
            http://127.0.0.1:3001/api/v1/farms/00000000-0000-4000-8000-000000000004/plant \
            > /tmp/plant-2.json &
          PLANT_PID_2=$!

          wait "$PLANT_PID_1"
          wait "$PLANT_PID_2"

          grep -q '"code":"PLANT_OK"' /tmp/plant-1.json
          grep -q '"code":"PLANT_OK"' /tmp/plant-2.json
          grep -q '"seedsConsumed":3' /tmp/plant-1.json
          grep -q '"seedsConsumed":3' /tmp/plant-2.json

          node - <<'NODE'
          const fs = require("fs");
          const assert = require("assert");
          const a = JSON.parse(fs.readFileSync("/tmp/plant-1.json", "utf8"));
          const b = JSON.parse(fs.readFileSync("/tmp/plant-2.json", "utf8"));
          assert.strictEqual(
            a.meta?.linearizedAt,
            b.meta?.linearizedAt,
            "idempotent plant replay changed linearizedAt"
          );
          assert.deepStrictEqual(
            a.data,
            b.data,
            "idempotent plant replay changed economic response"
          );
          NODE

          ACTIVE_CROPS=$(psql "$CI_DATABASE_ADMIN_URL" -Atc "SELECT count(*) FROM farmquest.planted_crop WHERE farm_id = '00000000-0000-4000-8000-000000000004'::uuid AND harvested_at IS NULL")
          test "$ACTIVE_CROPS" -eq 3

          PLANT_LEDGER=$(psql "$CI_DATABASE_ADMIN_URL" -Atc "SELECT count(*) FROM farmquest.item_ledger WHERE farm_id = '00000000-0000-4000-8000-000000000004'::uuid AND reason = 'PLANT'")
          test "$PLANT_LEDGER" -eq 1

          SEEDS_LEFT=$(psql "$CI_DATABASE_ADMIN_URL" -Atc "SELECT COALESCE(sum(quantity), 0) FROM farmquest.inventory_item WHERE farm_id = '00000000-0000-4000-8000-000000000004'::uuid AND item_definition_id = '00000000-0000-4000-8000-000000000020'::uuid")
          test "$SEEDS_LEFT" -eq 0

          psql "$CI_DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "UPDATE farmquest.planted_crop SET grows_at = clock_timestamp() - interval '1 second' WHERE farm_id = '00000000-0000-4000-8000-000000000004'::uuid AND harvested_at IS NULL"


          HARVEST_KEY="ci-harvest-idempotency-0001"
          curl --fail --silent --show-error \
            -b /tmp/farmquest-cookies.txt \
            -X POST \
            -H "X-CSRF-Token: $CSRF" \
            -H "Idempotency-Key: $HARVEST_KEY" \
            http://127.0.0.1:3001/api/v1/farms/00000000-0000-4000-8000-000000000004/harvest \
            > /tmp/harvest-1.json &
          HARVEST_PID_1=$!

          curl --fail --silent --show-error \
            -b /tmp/farmquest-cookies.txt \
            -X POST \
            -H "X-CSRF-Token: $CSRF" \
            -H "Idempotency-Key: $HARVEST_KEY" \
            http://127.0.0.1:3001/api/v1/farms/00000000-0000-4000-8000-000000000004/harvest \
            > /tmp/harvest-2.json &
          HARVEST_PID_2=$!

          wait "$HARVEST_PID_1"
          wait "$HARVEST_PID_2"

          grep -q '"code":"HARVEST_OK"' /tmp/harvest-1.json
          grep -q '"code":"HARVEST_OK"' /tmp/harvest-2.json

          node - <<'NODE'
          const fs = require("fs");
          const assert = require("assert");
          const a = JSON.parse(fs.readFileSync("/tmp/harvest-1.json", "utf8"));
          const b = JSON.parse(fs.readFileSync("/tmp/harvest-2.json", "utf8"));
          assert.strictEqual(
            a.meta?.linearizedAt,
            b.meta?.linearizedAt,
            "idempotent harvest replay changed linearizedAt"
          );
          assert.deepStrictEqual(
            a.data,
            b.data,
            "idempotent harvest replay changed economic response"
          );
          NODE

          HARVESTED_CROPS=$(psql "$CI_DATABASE_ADMIN_URL" -Atc "SELECT count(*) FROM farmquest.planted_crop WHERE farm_id = '00000000-0000-4000-8000-000000000004'::uuid AND harvested_at IS NOT NULL")
          test "$HARVESTED_CROPS" -eq 3

          HARVEST_LEDGER=$(psql "$CI_DATABASE_ADMIN_URL" -Atc "SELECT count(*) FROM farmquest.item_ledger WHERE farm_id = '00000000-0000-4000-8000-000000000004'::uuid AND reason = 'HARVEST'")
          test "$HARVEST_LEDGER" -eq 3

          CROP_UNITS=$(psql "$CI_DATABASE_ADMIN_URL" -Atc "SELECT COALESCE(sum(quantity), 0) FROM farmquest.inventory_item WHERE farm_id = '00000000-0000-4000-8000-000000000004'::uuid AND item_definition_id = '00000000-0000-4000-8000-000000000021'::uuid")
          test "$CROP_UNITS" -eq 3

          FARM_XP=$(psql "$CI_DATABASE_ADMIN_URL" -Atc "SELECT xp FROM farmquest.farm WHERE id = '00000000-0000-4000-8000-000000000004'::uuid")
          test "$FARM_XP" -ge 20

          FARM_COOLDOWN=$(psql "$CI_DATABASE_ADMIN_URL" -Atc "SELECT COALESCE(next_harvest_at::text, '') FROM farmquest.farm WHERE id = '00000000-0000-4000-8000-000000000004'::uuid")
          test -n "$FARM_COOLDOWN"


          curl --fail --silent --show-error \
            -c /tmp/farmquest-cookies-relogin.txt \
            -X POST \
            -H "X-Dev-Login-Secret: ci-dev-login-secret" \
            http://127.0.0.1:3001/api/v1/dev/session \
            -o /dev/null

          SEEDS_AFTER_RELOGIN=$(psql "$CI_DATABASE_ADMIN_URL" -Atc "SELECT COALESCE(sum(quantity), 0) FROM farmquest.inventory_item WHERE farm_id = '00000000-0000-4000-8000-000000000004'::uuid AND item_definition_id = '00000000-0000-4000-8000-000000000020'::uuid")
          test "$SEEDS_AFTER_RELOGIN" -eq 0

          INITIAL_SEED_GRANTS=$(psql "$CI_DATABASE_ADMIN_URL" -Atc "SELECT count(*) FROM farmquest.item_ledger WHERE farm_id = '00000000-0000-4000-8000-000000000004'::uuid AND item_definition_id = '00000000-0000-4000-8000-000000000020'::uuid AND reason = 'INITIAL_GRANT'")
          test "$INITIAL_SEED_GRANTS" -eq 1

          curl --fail --silent --show-error \
            -b /tmp/farmquest-cookies.txt \
            -X POST \
            -H "X-CSRF-Token: $CSRF" \
            http://127.0.0.1:3001/api/v1/auth/logout \
            -o /dev/null
