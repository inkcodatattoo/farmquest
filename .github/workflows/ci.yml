name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: farmquest_ci
          POSTGRES_PASSWORD: farmquest_ci
          POSTGRES_DB: farmquest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U farmquest_ci -d farmquest_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://farmquest_ci:farmquest_ci@127.0.0.1:5432/farmquest_ci?schema=farmquest
      DATABASE_MIGRATION_URL: postgresql://farmquest_ci:farmquest_ci@127.0.0.1:5432/farmquest_ci?schema=farmquest
      CI_DATABASE_ADMIN_URL: postgresql://farmquest_ci:farmquest_ci@127.0.0.1:5432/farmquest_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.7.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --allow-build=@prisma/engines --allow-build=prisma --allow-build=esbuild

      - name: Commit refreshed lockfile
        if: github.ref == 'refs/heads/feat/prototype-0.1-api'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh lockfile for NestJS pin"
            git push origin HEAD:feat/prototype-0.1-api
          fi

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: farmquest_ci
        run: pg_isready -h 127.0.0.1 -p 5432 -U farmquest_ci -d farmquest_ci

      - name: Verify repository structure
        run: node scripts/check-structure.mjs

      - name: Validate Prisma 7 schema
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Generate OpenAPI 0.1
        run: pnpm openapi:generate

      - name: Verify generated OpenAPI has no drift
        run: git diff --exit-code -- docs/openapi/farmquest-0.1.json

      - name: Provision database roles
        run: psql "$CI_DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/postgres/bootstrap/roles.sql

      - name: Apply committed migrations
        run: pnpm --filter @farmquest/database exec prisma migrate deploy --config prisma7.config.ts

      - name: Apply least-privilege grants
        run: psql "$CI_DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/postgres/bootstrap/grants.sql

      - name: Verify database invariants and privileges
        run: |
          psql "$CI_DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('farmquest.farm') IS NULL THEN
              RAISE EXCEPTION 'farmquest.farm was not created';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_indexes
              WHERE schemaname = 'farmquest'
                AND indexname = 'farm_user_streamer_active_uq'
            ) THEN
              RAISE EXCEPTION 'active farm partial unique index missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_indexes
              WHERE schemaname = 'farmquest'
                AND indexname = 'planted_crop_active_uq'
            ) THEN
              RAISE EXCEPTION 'active planting partial unique index missing';
            END IF;

            IF has_table_privilege('farmquest_app', 'farmquest.coin_ledger', 'UPDATE') THEN
              RAISE EXCEPTION 'farmquest_app must not UPDATE coin_ledger';
            END IF;

            IF NOT has_table_privilege('farmquest_app', 'farmquest.coin_ledger', 'INSERT') THEN
              RAISE EXCEPTION 'farmquest_app must be able to INSERT coin_ledger';
            END IF;

            IF has_schema_privilege('farmquest_app', 'farmquest', 'CREATE') THEN
              RAISE EXCEPTION 'farmquest_app must not CREATE in schema';
            END IF;
          END
          $$;
          SQL
